<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="telegram-bot-username" content="__BOT_USERNAME__">
  <title>По рукам — делим расходы</title>
  <link rel="stylesheet" href="/app/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ОБЩИЕ РАСХОДЫ</div>
        <h1 id="page-title">По рукам</h1>
      </div>
      <button class="avatar" id="avatar" type="button" aria-label="Профиль">S</button>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading-card">
        <div class="spinner"></div>
        <p>Собираем актуальные балансы…</p>
      </section>
    </main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Главная навигация">
      <button type="button" data-nav="collections" class="active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5.5h14M5 10.5h14M5 15.5h9"/><path d="M4 3h16a1 1 0 0 1 1 1v16l-3-2-3 2-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1Z"/></svg></span>Сборы</button>
      <button type="button" data-nav="balance"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5h16v11H4z"/><path d="M16 11h5v4h-5a2 2 0 0 1 0-4ZM7 7.5V5.8A1.8 1.8 0 0 1 8.8 4H18"/></svg></span>Баланс</button>
      <button type="button" data-nav="history"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.3-5.8L3.5 8.5"/><path d="M3.5 4.5v4h4M12 7.5V12l3 2"/></svg></span>История</button>
      <button type="button" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>Профиль</button>
    </nav>
  </div>
  <div id="sheet-layer" class="sheet-layer" hidden>
    <button id="sheet-backdrop" class="sheet-backdrop" type="button" aria-label="Закрыть"></button>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
