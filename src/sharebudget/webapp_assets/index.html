<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="telegram-bot-username" content="__BOT_USERNAME__">
  <title>По рукам — делим расходы</title>
  <link rel="stylesheet" href="/app/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ОБЩИЕ РАСХОДЫ</div>
        <h1 id="page-title">По рукам</h1>
      </div>
      <button class="avatar" id="avatar" type="button" aria-label="Профиль">S</button>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading-card">
        <div class="spinner"></div>
        <p>Собираем актуальные балансы…</p>
      </section>
    </main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Главная навигация">
      <button type="button" data-nav="collections" class="active"><span>🧾</span>Сборы</button>
      <button type="button" data-nav="balance"><span>⚖️</span>Баланс</button>
      <button type="button" data-nav="history"><span>🕘</span>История</button>
      <button type="button" data-nav="profile"><span>👤</span>Профиль</button>
    </nav>
  </div>
  <div id="sheet-layer" class="sheet-layer" hidden>
    <button id="sheet-backdrop" class="sheet-backdrop" type="button" aria-label="Закрыть"></button>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
