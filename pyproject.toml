[project]
name = "sharebudget-bot"
version = "0.1.0"
description = "Telegram bot for shared travel expenses and debt repayments"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.15,<4",
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
sharebudget = "sharebudget.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharebudget"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
